<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #1C2833;
}
.container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  margin: 60pt 80pt;
  flex: 1;
}
.accent-bar {
  width: 60pt;
  height: 4pt;
  background: #5EA8A7;
  margin-bottom: 24pt;
}
h1 {
  color: #FFFFFF;
  font-size: 34pt;
  font-weight: bold;
  margin: 0 0 12pt 0;
  line-height: 1.2;
}
h2 {
  color: #AAB7B8;
  font-size: 18pt;
  font-weight: normal;
  margin: 0 0 40pt 0;
}
p {
  color: #5EA8A7;
  font-size: 13pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="accent-bar"></div>
  <h1>Product Advisor</h1>
  <h2>Status & Nachste Schritte</h2>
  <p>Retro — 06.03.2026</p>
</div>
</body>
</html>
