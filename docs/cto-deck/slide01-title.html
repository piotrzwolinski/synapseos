<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 720px;
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(145deg, #0a0e17 0%, #111827 50%, #0a0e17 100%);
    display: flex;
    overflow: hidden;
    position: relative;
  }
  /* Subtle grid pattern */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(94,168,167,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,168,167,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px;
    position: relative;
    z-index: 1;
  }
  .accent-bar {
    width: 64px; height: 4px;
    background: linear-gradient(90deg, #5EA8A7, #3dd4d0);
    margin-bottom: 32px;
    border-radius: 2px;
  }
  h1 {
    font-size: 52px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  h1 .highlight {
    color: #5EA8A7;
  }
  h2 {
    font-size: 22px;
    font-weight: 300;
    color: #94a3b8;
    margin-bottom: 48px;
    line-height: 1.4;
  }
  .meta {
    font-size: 13px;
    color: #475569;
    letter-spacing: 1px;
  }
  .meta span {
    color: #5EA8A7;
  }
  /* Right side: abstract graph visualization */
  .right {
    width: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .graph-viz {
    position: relative;
    width: 300px;
    height: 400px;
  }
  .node {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #5EA8A7;
  }
  .node.dim { background: #1e3a3a; }
  .node.bright { background: #3dd4d0; box-shadow: 0 0 20px rgba(61,212,208,0.3); }
  .node.accent { background: #f59e0b; box-shadow: 0 0 15px rgba(245,158,11,0.2); }
  .edge {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, rgba(94,168,167,0.4), rgba(94,168,167,0.1));
    transform-origin: left center;
  }
  /* Positioned nodes to form abstract graph */
  .n1 { top: 40px; left: 150px; }
  .n2 { top: 100px; left: 60px; }
  .n3 { top: 90px; left: 220px; }
  .n4 { top: 170px; left: 130px; }
  .n5 { top: 160px; left: 250px; }
  .n6 { top: 230px; left: 50px; }
  .n7 { top: 240px; left: 180px; }
  .n8 { top: 300px; left: 100px; }
  .n9 { top: 310px; left: 240px; }
  .n10 { top: 360px; left: 160px; }
  /* SVG edges */
  .edges {
    position: absolute;
    inset: 0;
  }
  .edges line {
    stroke: rgba(94,168,167,0.2);
    stroke-width: 1;
  }
  .edges line.active {
    stroke: rgba(94,168,167,0.5);
    stroke-width: 1.5;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="accent-bar"></div>
    <h1>Product Advisor<br/><span class="highlight">Under the Hood</span></h1>
    <h2>Graph Reasoning Architecture<br/>& Enterprise Scaling Path</h2>
    <div class="meta">MANN+HUMMEL &times; SYNAPSE OS &nbsp;&mdash;&nbsp; <span>March 2026</span></div>
  </div>
  <div class="right">
    <div class="graph-viz">
      <svg class="edges" width="300" height="400" viewBox="0 0 300 400">
        <line x1="156" y1="46" x2="66" y2="106" />
        <line x1="156" y1="46" x2="226" y2="96" class="active"/>
        <line x1="66" y1="106" x2="136" y2="176" />
        <line x1="226" y1="96" x2="256" y2="166" class="active"/>
        <line x1="226" y1="96" x2="136" y2="176" />
        <line x1="136" y1="176" x2="186" y2="246" class="active"/>
        <line x1="56" y1="236" x2="136" y2="176" />
        <line x1="56" y1="236" x2="106" y2="306" />
        <line x1="186" y1="246" x2="246" y2="316" />
        <line x1="186" y1="246" x2="106" y2="306" class="active"/>
        <line x1="106" y1="306" x2="166" y2="366" class="active"/>
        <line x1="246" y1="316" x2="166" y2="366" />
        <line x1="256" y1="166" x2="186" y2="246" />
      </svg>
      <div class="node bright n1"></div>
      <div class="node dim n2"></div>
      <div class="node n3"></div>
      <div class="node accent n4"></div>
      <div class="node dim n5"></div>
      <div class="node dim n6"></div>
      <div class="node bright n7"></div>
      <div class="node n8"></div>
      <div class="node dim n9"></div>
      <div class="node accent n10"></div>
    </div>
  </div>
</body>
</html>
