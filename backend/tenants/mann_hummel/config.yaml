# =============================================================================
# ASSEMBLY CONFIGURATION (v2.7)
# =============================================================================
# Defines how multi-unit assemblies share properties.
# Python reads this list — no property names hardcoded in code.

assembly:
  # Properties automatically synced across all units in the same assembly group.
  # Same duct = same dimensions/capacity. Remove a property to stop syncing it.
  # housing_length is intentionally NOT here — each stage has its own from graph auto-resolve.
  shared_properties:
    - "filter_width"
    - "filter_height"
    - "housing_width"
    - "housing_height"
    - "airflow_m3h"

# =============================================================================
# DIMENSION & MATERIAL TABLES (Phase 2: Externalized from dimension_tables.py)
# =============================================================================

dimension_mapping:
  filter_to_housing:
    287: 300
    305: 300
    300: 300
    592: 600
    610: 600
    600: 600
    495: 500
    500: 500
    900: 900
    1200: 1200

corrosion_class_map:
  FZ: "C3"
  AZ: "C4"
  ZM: "C5"
  RF: "C5"
  SF: "C5.1"

housing_length_derivation:
  GDMI:
    - max_depth: 450
      length: 600
    - max_depth: 99999
      length: 850
  GDC:
    - max_depth: 450
      length: 750
    - max_depth: 99999
      length: 900
  GDB:
    - max_depth: 292
      length: 550
    - max_depth: 450
      length: 750
    - max_depth: 99999
      length: 900
  # GDP panel filters have a FIXED 250mm housing length (catalog: Planfilterskåp,
  # "Standard 250 mm längd", frame depths 25/50/100mm). Length does not vary with
  # filter depth. Without this block GDP fell back to the first rule set (GDMI).
  GDP:
    - max_depth: 99999
      length: 250

orientation_threshold: 600

material_codes_extended:
  - code: "RF"
    aliases: ["STAINLESS", "STAINLESS STEEL", "ROSTFRI", "NIERDZEWNA"]
    extraction_keywords: ["stainless steel", "stainless", "nierdzewna", "rostfri", "edelstahl", "inox", "rf"]
  - code: "FZ"
    aliases: ["GALVANIZED", "ZINC", "CYNK"]
    extraction_keywords: ["galvanized", "verzinkt", "zinc", "cynk", "fz"]
  - code: "ZM"
    aliases: ["ZINKMAGNESIUM", "MAGNELIS"]
    extraction_keywords: ["zinkmagnesium", "magnelis", "zm"]
  - code: "SF"
    aliases: ["SENDZIMIR"]
    extraction_keywords: ["sendzimir", "sf"]
  - code: "AZ"
