version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graph-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_USERNAME=${FALKORDB_USERNAME:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_GRAPH=${FALKORDB_GRAPH:-synapse}
      - DOMAIN_ID=${DOMAIN_ID:-mann_hummel}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - graph-network

  # FalkorDB Graph Database
  falkordb:
    image: falkordb/falkordb:latest
    container_name: graph-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - graph-network

volumes:
  falkordb_data:

networks:
  graph-network:
    driver: bridge
